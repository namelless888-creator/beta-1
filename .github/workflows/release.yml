name: Publish tested Windows build
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build Windows run ID
        required: true
      tag:
        description: Release tag
        required: true
        default: v0.2.0
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Publish the verified executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BUILD_RUN: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:BUILD_RUN -notmatch '^\d+$' -or $env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid release parameters' }
          $run = gh api "repos/$env:REPOSITORY/actions/runs/$env:BUILD_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.conclusion -ne 'success' -or $run.name -ne 'Build Windows' -or $run.head_branch -ne 'main') { throw 'Only a successful main build can be released' }
          gh run download $env:BUILD_RUN --repo $env:REPOSITORY --name Beta1-Windows-x64 --dir verified
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
          gh release view $env:RELEASE_TAG --repo $env:REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --repo $env:REPOSITORY --target $run.head_sha --title "Бета 1 $env:RELEASE_TAG" --draft --notes 'Скачайте Beta1.exe. Перед обновлением завершите старую версию через значок Бета 1. Настройки открываются из собственного трея. Обои не изменяются.'
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $env:RELEASE_TAG verified/Beta1.exe --repo $env:REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'EXE upload failed' }
          gh release edit $env:RELEASE_TAG --repo $env:REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
